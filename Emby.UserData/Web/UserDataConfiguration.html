<div id="userDataPage" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
<style>
#userDataPage{max-width:1080px;margin:auto;color:var(--theme-body-text-color)} #userDataPage .hero{border-left:5px solid #00a4dc;padding:1rem 1.25rem;margin:1rem 0 1.5rem;background:linear-gradient(90deg,rgba(0,164,220,.12),transparent)}#userDataPage h1{margin:0;font-size:2rem}#userDataPage .muted{opacity:.7;margin:.35rem 0 0}.ud-tabs{display:flex;border-bottom:1px solid rgba(128,128,128,.25);gap:1.3rem;margin-bottom:1.5rem}.ud-tabs button{background:transparent;border:0;color:inherit;padding:.9rem .2rem;cursor:pointer;font-weight:bold}.ud-tabs button.active{border-bottom:3px solid #00a4dc}.ud-panel{display:none}.ud-panel.active{display:block}.ud-card{padding:1.25rem;margin:.75rem 0;background:rgba(128,128,128,.07);border-radius:8px}.ud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:1rem}.ud-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.ud-list{list-style:none;padding:0}.ud-list li{display:flex;align-items:center;gap:.7rem;padding:.75rem;border-bottom:1px solid rgba(128,128,128,.16)}.ud-list .grow{flex:1}.ud-pill{font-size:.75rem;border:1px solid currentColor;border-radius:999px;padding:.15rem .55rem;opacity:.7}.ud-notice{min-height:1.5em;color:#00a4dc}.ud-danger{color:#e84d5b}.ud-label{display:block;margin-bottom:.35rem;font-weight:bold}.ud-hidden{display:none!important}@media(max-width:600px){#userDataPage{padding:0 .75rem}}
</style>
<div class="hero"><h1>Datos de usuarios</h1><p class="muted">Campos privados definidos por el administrador. Los valores se guardan fuera de la base de datos de Emby.</p></div>
<div class="ud-tabs"><button class="active" data-tab="fields">Campos</button><button data-tab="values">Datos por usuario</button></div>
<div id="notice" class="ud-notice" role="status"></div>
<section id="fields" class="ud-panel active"><div class="ud-card"><h2 id="fieldTitle">Nuevo campo</h2><div class="ud-grid"><div><label class="ud-label" for="fieldName">Nombre</label><input id="fieldName" is="emby-input" required></div><div><label class="ud-label" for="fieldType">Tipo</label><select id="fieldType" is="emby-select"><option value="Text">Texto corto</option><option value="TextArea">Texto largo</option><option value="Date">Fecha</option><option value="Number">Número</option><option value="Boolean">Sí / No</option><option value="Select">Lista de opciones</option></select></div><div id="optionsWrap" class="ud-hidden"><label class="ud-label" for="fieldOptions">Opciones</label><input id="fieldOptions" is="emby-input" placeholder="Una opción por línea"></div><div><label><input id="fieldRequired" type="checkbox" is="emby-checkbox"> Obligatorio</label></div></div><div class="ud-actions"><button id="saveField" is="emby-button" type="button" class="raised button-submit">Guardar campo</button><button id="cancelField" is="emby-button" type="button" class="raised">Cancelar</button></div></div><div class="ud-card"><h2>Campos configurados</h2><ul id="fieldList" class="ud-list"></ul></div></section>
<section id="values" class="ud-panel"><div class="ud-card"><label class="ud-label" for="userSelect">Usuario de Emby</label><select id="userSelect" is="emby-select"></select><p class="muted">Selecciona un usuario para ver y guardar sus datos adicionales.</p></div><form id="valueForm" class="ud-card"></form></section>
</div>
<script>
(function(){'use strict';var page=document.querySelector('#userDataPage'),fields=[],editing=null;function qs(s){return page.querySelector(s)}function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}function note(m,error){var e=qs('#notice');e.textContent=m;e.className='ud-notice'+(error?' ud-danger':'')}function api(url,method,data){return ApiClient.ajax({url:ApiClient.getUrl(url),type:method||'GET',data:data?JSON.stringify(data):null,contentType:'application/json'})}function tabs(){page.querySelectorAll('.ud-tabs button').forEach(function(b){b.onclick=function(){page.querySelectorAll('.ud-tabs button,.ud-panel').forEach(function(x){x.classList.remove('active')});b.classList.add('active');qs('#'+b.dataset.tab).classList.add('active')}})}function reset(){editing=null;qs('#fieldTitle').textContent='Nuevo campo';qs('#fieldName').value='';qs('#fieldType').value='Text';qs('#fieldOptions').value='';qs('#fieldRequired').checked=false;qs('#optionsWrap').classList.add('ud-hidden')}function renderFields(){var l=qs('#fieldList');l.innerHTML=fields.map(function(f){return '<li><span class="grow"><strong>'+esc(f.Name)+'</strong> <span class="ud-pill">'+esc(f.Type)+'</span> '+(!f.IsActive?'<span class="ud-danger">inactivo</span>':'')+'</span><button data-edit="'+f.Id+'" is="emby-button">Editar</button><button data-toggle="'+f.Id+'" is="emby-button">'+(f.IsActive?'Desactivar':'Activar')+'</button><button data-delete="'+f.Id+'" is="emby-button" class="ud-danger">Borrar</button></li>'}).join('')||'<li class="muted">Aún no hay campos.</li>';l.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){editing=fields.filter(function(x){return x.Id===b.dataset.edit})[0];qs('#fieldTitle').textContent='Editar campo';qs('#fieldName').value=editing.Name;qs('#fieldType').value=editing.Type;qs('#fieldOptions').value=(editing.Options||[]).join('\n');qs('#fieldRequired').checked=editing.Required;qs('#optionsWrap').classList.toggle('ud-hidden',editing.Type!=='Select');window.scrollTo(0,0)}});l.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(){var f=fields.filter(function(x){return x.Id===b.dataset.toggle})[0];f.IsActive=!f.IsActive;api('UserData/Fields','POST',{Field:f}).then(load)}});l.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){if(confirm('¿Borrar permanentemente este campo y todos sus valores?'))api('UserData/Fields/'+b.dataset.delete+'?Permanent=true','DELETE').then(load)}})}function load(){return api('UserData/Fields').then(function(r){fields=r||[];renderFields();renderForm()}).catch(function(e){note('No se pudieron cargar los datos: '+(e.message||e),true)})}function users(){if(!ApiClient.getUsers)return;ApiClient.getUsers().then(function(r){var a=r.Items||r;qs('#userSelect').innerHTML='<option value="">Selecciona un usuario</option>'+a.map(function(u){return '<option value="'+u.Id+'">'+esc(u.Name)+'</option>'}).join('')})}function renderForm(){var form=qs('#valueForm'),id=qs('#userSelect').value;if(!id){form.innerHTML='<p class="muted">Selecciona un usuario.</p>';return}var active=fields.filter(function(f){return f.IsActive});api('UserData/Users/'+id).then(function(record){var values=record.Values||{};form.innerHTML='<h2>Datos adicionales</h2>'+active.map(function(f){var v=values[f.Id]||'',c='<label class="ud-label">'+esc(f.Name)+(f.Required?' *':'')+'</label>';if(f.Type==='TextArea')c+='<textarea data-field="'+f.Id+'" is="emby-input">'+esc(v)+'</textarea>';else if(f.Type==='Select')c+='<select data-field="'+f.Id+'" is="emby-select">'+(f.Options||[]).map(function(o){return '<option '+(v===o?'selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';else if(f.Type==='Boolean')c+='<select data-field="'+f.Id+'" is="emby-select"><option value="false" '+(v!=='true'?'selected':'')+'>No</option><option value="true" '+(v==='true'?'selected':'')+'>Sí</option></select>';else c+='<input data-field="'+f.Id+'" type="'+(f.Type==='Date'?'date':f.Type==='Number'?'number':'text')+'" value="'+esc(v)+'" is="emby-input">';return '<div>'+c+'</div>'}).join('')+'<div class="ud-actions"><button is="emby-button" class="raised button-submit">Guardar datos</button></div>';form.onsubmit=function(e){e.preventDefault();var values={};form.querySelectorAll('[data-field]').forEach(function(el){values[el.dataset.field]=el.value});api('UserData/Users/'+id,'POST',{UserId:id,Values:values}).then(function(){note('Datos guardados.')}).catch(function(e){note(e.responseJSON&&e.responseJSON.Message||'No se pudieron guardar los datos.',true)})}})}qs('#fieldType').onchange=function(){qs('#optionsWrap').classList.toggle('ud-hidden',this.value!=='Select')};qs('#saveField').onclick=function(){var f=editing||{};f.Name=qs('#fieldName').value;f.Type=qs('#fieldType').value;f.Required=qs('#fieldRequired').checked;f.IsActive=editing?editing.IsActive:true;f.Options=qs('#fieldOptions').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);api('UserData/Fields','POST',{Field:f}).then(function(){note('Campo guardado.');reset();load()}).catch(function(e){note('Revisa el campo e inténtalo de nuevo.',true)})};qs('#cancelField').onclick=reset;qs('#userSelect').onchange=renderForm;tabs();reset();users();load()})();
</script>
